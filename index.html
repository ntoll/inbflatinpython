<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InB♭InPython</title>
  <script type="module" src="https://bfp.dev/test/core.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg">
</head>
<body>
  <main aria-label="The rehearsal room">
    <header>
      <h1>InB&flat;InPython</h1>
      <a id="about" href="about/"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.6 9a3.4 3.4 0 1 1 5.6 2.6c-1 .9-2.2 1.5-2.2 3"/><circle cx="12" cy="18.6" r="1.2" fill="currentColor" stroke="none"/></svg>About</a>
    </header>
    <section id="editor" aria-label="The score"></section>
    <p id="controls">
      <button id="play"><svg viewBox="0 0 254.83 254.831" aria-hidden="true" focusable="false" fill="currentColor"><path d="M224.774,178.355V42.865V13.753V0L79.044,52.499v8.223v35.325v99.319c-4.5-2.004-9.528-3.159-14.867-3.159c-18.84,0-34.121,14.018-34.121,31.312s15.281,31.312,34.121,31.312c18.191,0,33.013-13.059,34.036-29.51h0.101V89.015l107.192-39.116v98.496c-4.51-1.999-9.532-3.159-14.871-3.159c-18.833,0-34.119,14.022-34.119,31.317c0,17.29,15.286,31.307,34.119,31.307c18.196,0,33.016-13.059,34.041-29.505H224.774z"/></svg>Play</button>
      <button id="share"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="5.5" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="M8.4 10.8l7.2-4M8.4 13.2l7.2 4"/></svg>Share</button>
      <a href="docs/"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.4-4.4-1.9-8-1.9v13.8c3.6 0 6 .5 8 1.9 2-1.4 4.4-1.9 8-1.9V4.1c-3.6 0-6 .5-8 1.9z"/><path d="M12 6v13.8"/></svg>Docs</a>
    </p>
    <output id="share-note" aria-live="polite"></output>
    <pre id="errors" aria-live="polite"></pre>
  </main>

  <section id="hall" aria-label="The performance stage">
    <header>
      <p id="brand">InB&flat;InPython</p>
      <button id="stop"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="1" fill="currentColor"/></svg>Stop</button>
      <span id="pulse" aria-hidden="true"></span>
      <output id="log" aria-live="polite"></output>
    </header>
    <div id="boards">
      <div id="stage" aria-label="The performers"></div>
      <div id="verses" aria-label="The poem"></div>
    </div>
  </section>

  <!-- The single main-thread Python context lives in
       main.py. The config carries CodeMirror 6 as JavaScript
       modules, and maps the stagehand, the poem and the
       initial score in as ordinary files. -->
  <script type="mpy" debug src="./main.py" config='{
    "js_modules": {
      "https://esm.sh/codemirror@6.0.2?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.9,@codemirror/language@6.12.4": "codemirror",
      "https://esm.sh/@codemirror/lang-python@6.2.1?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.9,@codemirror/language@6.12.4": "lang_python"
    },
    "files": {
      "./inbflat.py": "./inbflat.py",
      "./verses.py": "./verses.py",
      "./score.py": "./score.py"
    }
  }'></script>
</body>
</html>
